<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Juli's Draft Room</title>
<meta name="theme-color" content="#1d2d1b" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="JDB" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
  :root{
    --bg:#1d2d1b; --panel:#26361f; --panel2:#2e3f26; --line:#3a4d32;
    --text:#e8ece3; --muted:#98a88f; --gold:#f5c451;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;}
  #app{max-width:640px;margin:0 auto;min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line);
       padding-bottom:env(safe-area-inset-bottom);}
  .head{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(16px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line);}
  .title{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;}
  .kicker{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:16px;}
  .picks{font-size:12px;color:var(--muted);}
  .seg{display:flex;gap:6px;margin-top:12px;}
  .segbtn{flex:1;display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:9px 12px;background:var(--panel);
          border:1px solid var(--line);border-radius:9px;cursor:pointer;color:var(--muted);text-align:left;font:inherit;}
  .segbtn.on{background:var(--panel2);border-color:#4a5f40;color:var(--text);}
  .segbtn b{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:.03em;}
  .segbtn span{font-size:11px;}
  .scoring{margin:9px 2px 0;font-size:11.5px;color:var(--muted);}
  .viewseg{margin-top:12px;}
  .viewbtn{flex:1;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--muted);
           font:600 13px 'Inter',sans-serif;cursor:pointer;}
  .viewbtn.on{background:var(--gold);border-color:var(--gold);color:#1d2d1b;}
  .livebar{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:20px;
        border:1px solid var(--line);background:var(--panel);color:var(--muted);}
  .pill.on{color:#3ed99b;border-color:#2f5a3a;}
  .pill.err{color:var(--gold);border-color:#5a4a2b;}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;flex:none;}
  .dot.live{animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .connectbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);font:600 12px 'Inter',sans-serif;
              padding:6px 12px;border-radius:7px;cursor:pointer;}
  .connectbtn.on{background:#3ed99b;border-color:#3ed99b;color:#12210f;}
  .connectbtn.gear{margin-left:auto;padding:6px 10px;}
  .live-panel{width:100%;display:flex;flex-direction:column;gap:9px;margin-top:9px;padding:11px;background:var(--panel);
              border:1px solid var(--line);border-radius:9px;}
  .live-panel label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:4px;}
  .live-panel input{padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--text);font-size:13px;outline:none;}
  .live-panel input:focus{border-color:#4a5f40;}
  .live-note{font-size:11px;color:var(--muted);line-height:1.45;margin:0;}
  .controls{position:sticky;top:0;z-index:4;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line);}
  .search{width:100%;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:14px;outline:none;}
  .search::placeholder{color:#6f7f66;}
  .search:focus{border-color:#4a5f40;}
  .chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;background:var(--panel);border:1px solid var(--line);
        border-radius:20px;color:var(--text);font:600 12px 'Inter',sans-serif;cursor:pointer;}
  .chip.on{background:#e8ece3;color:#1d2d1b;border-color:#e8ece3;}
  .chip .n{font-size:10px;opacity:.7;font-weight:500;}
  .list{padding:4px 12px 24px;}
  .tier{margin-top:14px;}
  .tier-head{display:flex;justify-content:space-between;align-items:center;font-family:'Oswald',sans-serif;letter-spacing:.08em;
             text-transform:uppercase;font-size:12px;color:var(--muted);padding:4px 4px 8px;border-bottom:1px dashed var(--line);}
  .tier-head .n{font-size:11px;}
  .row{display:flex;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid #243021;cursor:pointer;}
  .row:active{background:var(--panel);}
  .rank{width:26px;text-align:center;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;color:var(--muted);flex:none;}
  .postag{flex:none;width:34px;text-align:center;padding:3px 0;border-radius:5px;font-family:'Oswald',sans-serif;font-weight:700;
          font-size:11px;color:#1d2d1b;letter-spacing:.03em;}
  .name{flex:1;font-size:14.5px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .team{font-size:11px;color:var(--muted);flex:none;letter-spacing:.03em;}
  .star{flex:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:#6f7f66;
        font-size:16px;cursor:pointer;line-height:1;}
  .star:active{color:var(--gold);border-color:var(--gold);}
  .draftedwrap{margin-top:22px;border-top:1px solid var(--line);padding-top:10px;}
  .drafted-toggle{background:none;border:none;color:var(--muted);font:600 12.5px 'Inter',sans-serif;cursor:pointer;padding:6px 4px;}
  .draftedrow{display:flex;align-items:center;gap:9px;padding:8px;opacity:.72;}
  .drafted-name{flex:1;font-size:13.5px;text-decoration:line-through;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .statustag{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;flex:none;}
  .statustag.mine{color:var(--gold);}
  .statustag.live{color:#3ed99b;}
  .mini{flex:none;width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-size:12px;}
  .team-view{padding:12px 16px 24px;}
  .team-head{display:flex;justify-content:space-between;align-items:center;font-family:'Oswald',sans-serif;text-transform:uppercase;
             letter-spacing:.08em;font-size:13px;color:var(--text);padding-bottom:8px;border-bottom:1px solid var(--line);}
  .team-count{font-size:11px;color:var(--muted);}
  .slot{display:flex;align-items:center;gap:11px;padding:11px 6px;border-bottom:1px solid #243021;}
  .slot.empty{opacity:.5;}
  .slot-label{flex:none;min-width:44px;text-align:center;padding:4px 6px;border-radius:6px;font-family:'Oswald',sans-serif;
              font-weight:700;font-size:11px;letter-spacing:.04em;border:1px solid var(--line);}
  .slot-name{flex:1;font-size:14.5px;font-weight:500;}
  .slot-team{font-size:11px;color:var(--muted);}
  .slot-empty{flex:1;font-size:13px;color:var(--muted);font-style:italic;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 12px;}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-top:1px solid var(--line);flex-wrap:wrap;}
  .src{font-size:11px;color:#7c8c73;flex:1;min-width:180px;}
  .reset{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:7px 12px;border-radius:7px;font:600 12px 'Inter',sans-serif;cursor:pointer;}
  .reset.yes{color:#f26d6d;border-color:#5a2b2b;}
  .reset-confirm{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
  .tr-wrap{padding:12px 16px 26px;}
  .tr-sync{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px;}
  .tr-btn{background:var(--panel);border:1px solid var(--line);color:var(--text);font:600 12.5px 'Inter',sans-serif;
          padding:8px 14px;border-radius:8px;cursor:pointer;}
  .tr-btn.primary{background:#3ed99b;border-color:#3ed99b;color:#12210f;}
  .tr-msg{font-size:11.5px;color:var(--muted);flex:1;min-width:150px;}
  .tr-bootstrap{font-size:11px;color:var(--gold);border:1px solid #5a4a2b;background:rgba(245,196,81,.07);
                padding:8px 11px;border-radius:8px;margin-bottom:14px;line-height:1.45;}
  .tr-sec{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;
          color:var(--text);padding-bottom:7px;border-bottom:1px solid var(--line);margin:18px 0 9px;
          display:flex;justify-content:space-between;align-items:center;}
  .tr-sec span{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:0;color:var(--muted);text-transform:none;}
  .tr-needs{display:flex;gap:6px;flex-wrap:wrap;}
  .tr-need{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;font-size:11.5px;
           font-weight:600;border:1px solid var(--line);background:var(--panel);}
  .tr-need .lbl{font-family:'Oswald',sans-serif;letter-spacing:.04em;}
  .tr-need.need{border-color:#6b3535;color:#f28b8b;}
  .tr-need.surplus{border-color:#2f5a3a;color:#6fdca6;}
  .tr-card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px;margin-bottom:10px;}
  .tr-head2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px;}
  .tr-opp{font-size:12px;color:var(--muted);}
  .tr-gain{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;color:#3ed99b;}
  .tr-side{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:13px;}
  .tr-dir{flex:none;width:44px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:3px;}
  .tr-plist{flex:1;display:flex;flex-direction:column;gap:3px;}
  .tr-p{display:flex;align-items:center;gap:7px;}
  .tr-ptag{flex:none;width:30px;text-align:center;padding:2px 0;border-radius:4px;font-family:'Oswald',sans-serif;
           font-weight:700;font-size:10px;color:#1d2d1b;}
  .tr-pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tr-ppw{font-size:11px;color:var(--muted);flex:none;}
  .tr-why{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .tr-why b{color:var(--text);font-weight:600;}
  .tr-lineup{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #243021;font-size:13px;}
  .tr-slot{flex:none;min-width:42px;text-align:center;padding:3px 6px;border-radius:5px;font-family:'Oswald',sans-serif;
           font-weight:700;font-size:10px;letter-spacing:.04em;border:1px solid var(--line);color:var(--muted);}
  .tr-weak{color:#f28b8b;}
  .tr-mode{display:flex;gap:0;margin-bottom:12px;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .tr-mode button{flex:1;padding:9px 8px;background:var(--panel);border:0;color:var(--muted);
                  font:600 12px 'Inter',sans-serif;cursor:pointer;line-height:1.35;}
  .tr-mode button.on{background:var(--gold);color:#1d2d1b;}
  .tr-mode small{display:block;font-weight:500;font-size:10px;opacity:.8;}
  .tr-sos{flex:none;font-size:10px;letter-spacing:.5px;color:var(--muted);width:34px;text-align:right;}
  .tr-sos.good{color:#6fdca6;}
  .tr-sos.bad{color:#f28b8b;}
  .tr-stamp{font-size:10.5px;color:#7c8c73;margin-top:14px;line-height:1.5;}
</style>
</head>
<body>
<div id="app"><p class="empty">Loading boards…</p></div>

<script>
const POS_COLOR = { QB:"#f26d6d", RB:"#3ed99b", WR:"#5fa8f5", TE:"#f6bb45", DEF:"#b193f0" };
const POS_ORDER = ["QB","RB","WR","TE","DEF"];
const pid = p => (p.pos + "-" + p.name).replace(/[^a-zA-Z0-9]/g,"");

const state = {
  board:"redraft", view:"board", posFilter:"ALL", search:"",
  showDrafted:false, confirmReset:false,
  drafted:{ redraft:{}, dynasty:{} },
  BOARDS:{},
  live:{ on:false, connecting:false, error:"", panelOpen:false,
         leagueId:"1388267219577761792", username:"Meneertje", draftInput:"",
         draftId:null, myUserId:null, picks:{}, count:0, matched:0, timer:null, index:null },
  ros:null,
  tr:{ syncing:false, error:"", synced:false, rosters:null, users:null, league:null,
       myRosterId:null, suggestions:[], posFilter:"ALL", lastSync:null, valueMode:"playoff" }
};

function loadDrafted(){
  for(const k of ["redraft","dynasty"]){
    try{ const v = localStorage.getItem("draft-"+k); if(v) state.drafted[k] = JSON.parse(v); }
    catch(e){}
  }
}
function persist(k){
  try{ localStorage.setItem("draft-"+k, JSON.stringify(state.drafted[k])); }catch(e){}
}
function setStatus(id, status){
  const map = state.drafted[state.board];
  if(status===null) delete map[id]; else map[id]=status;
  persist(state.board); render();
}
function resetBoard(){ state.drafted[state.board]={}; persist(state.board); state.confirmReset=false; render(); }

// merged view: manual marks + live Sleeper picks (live applies to the redraft league only)
function mergedStatus(){
  const manual = state.drafted[state.board];
  if(!(state.board==="redraft" && state.live.on)) return manual;
  const out = Object.assign({}, manual);
  for(const id in state.live.picks){
    out[id] = (state.live.picks[id]==="mine" || out[id]==="mine") ? "mine" : "gone";
  }
  return out;
}

// ---------- Sleeper live sync ----------
const SLEEPER = "https://api.sleeper.app/v1";
const TEAMMAP = { JAC:"JAX", WSH:"WAS" };
const tnorm = t => { t=(t||"").toUpperCase(); return TEAMMAP[t]||t; };
const nname = s => (s||"").toLowerCase().split(/\s+/)
  .filter(w => !["jr","sr","ii","iii","iv","v"].includes(w.replace(/\./g,"")))
  .join("").replace(/[^a-z0-9]/g,"");
function parseDraftId(s){ if(!s) return null; s=String(s).trim();
  const m=s.match(/draft\/[a-z]*\/*(\d{6,})/i); if(m) return m[1];
  const d=s.match(/(\d{6,})/); return d?d[1]:null; }
function parseId(s){ const d=String(s||"").match(/(\d{6,})/); return d?d[1]:null; }

function buildLiveIndex(){
  const b = state.BOARDS.redraft; if(!b) return;
  const idx = {};
  b.players.forEach(p=>{
    if(p.pos==="DEF"){ const k="def:"+tnorm(p.team); (idx[k]=idx[k]||[]).push(p); return; }
    const k=nname(p.name); (idx[k]=idx[k]||[]).push(p);
  });
  state.live.index = idx;
}
function matchPick(meta){
  const idx = state.live.index; if(!idx) return null;
  const pos = (meta.position||"").toUpperCase();
  if(pos==="DEF" || pos==="DST"){ const c=idx["def:"+tnorm(meta.team)]; return c?c[0]:null; }
  let c = idx[ nname((meta.first_name||"")+" "+(meta.last_name||"")) ];
  if(!c) return null;
  if(c.length>1){ const f=c.filter(p=>p.pos===pos && tnorm(p.team)===tnorm(meta.team)); if(f.length) c=f; }
  return c[0];
}
async function sjson(url){ const r=await fetch(url,{cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
function liveSaveCfg(){ try{ localStorage.setItem("sleeper-league",state.live.leagueId); localStorage.setItem("sleeper-user",state.live.username); localStorage.setItem("sleeper-draft",state.live.draftInput);}catch(e){} }

async function resolveUser(username){
  try{ const u=await sjson(SLEEPER+"/user/"+encodeURIComponent(username)); if(u&&u.user_id) return u.user_id; }catch(e){}
  try{ const us=await sjson(SLEEPER+"/league/"+state.live.leagueId+"/users");
       const m=(us||[]).find(x=>(x.display_name||"").toLowerCase()===username.toLowerCase());
       if(m) return m.user_id; }catch(e){}
  return null;
}
async function resolveDraft(leagueId){
  const ds = await sjson(SLEEPER+"/league/"+leagueId+"/drafts");
  if(!ds || !ds.length) return null;
  const active = ds.find(d=>["drafting","in_progress","paused"].includes(d.status));
  return (active || ds.slice().sort((a,b)=>(b.created||0)-(a.created||0))[0]).draft_id;
}
async function sleeperConnect(){
  const L=state.live; L.connecting=true; L.error=""; render();
  liveSaveCfg();
  try{
    L.myUserId = await resolveUser(L.username);
    let did = parseDraftId(L.draftInput);
    if(!did) did = await resolveDraft(parseId(L.leagueId) || L.leagueId);
    if(!did) throw new Error("no draft found \u2014 paste your draft link in \u2699");
    L.draftId=did; L.on=true; L.connecting=false; L.panelOpen=false;
    try{ localStorage.setItem("sleeper-connected","1"); }catch(e){}
    await pollPicks();
    if(L.timer) clearInterval(L.timer);
    L.timer = setInterval(pollPicks, 4000);
  }catch(e){
    L.connecting=false; L.on=false; L.error=String(e.message||e);
    try{ localStorage.setItem("sleeper-connected","0"); }catch(_){}
    render();
  }
}
function sleeperDisconnect(){
  const L=state.live;
  if(L.timer) clearInterval(L.timer); L.timer=null;
  L.on=false; L.picks={}; L.count=0; L.matched=0; L.error="";
  try{ localStorage.setItem("sleeper-connected","0"); }catch(e){}
  render();
}
async function pollPicks(){
  const L=state.live; if(!L.draftId) return;
  try{
    const picks = await sjson(SLEEPER+"/draft/"+L.draftId+"/picks");
    const m={}; let matched=0;
    (picks||[]).forEach(pk=>{
      const pl = matchPick(pk.metadata||{}); if(!pl) return;
      m[pid(pl)] = (pk.picked_by && pk.picked_by===L.myUserId) ? "mine" : "gone";
      matched++;
    });
    L.picks=m; L.count=(picks||[]).length; L.matched=matched; L.error="";
    render();
  }catch(e){
    L.error="reconnecting…"; render();   // keep last picks on a transient failure
  }
}

// network-first data load: newest rankings when online, cached copy when offline
async function loadBoard(key){
  try{
    const res = await fetch("./data/"+key+".json", {cache:"no-store"});
    if(res.ok) return await res.json();
  }catch(e){}
  const res = await fetch("./data/"+key+".json");   // fall back to SW cache
  return await res.json();
}

function el(tag, attrs={}, ...kids){
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==="class") n.className=v;
    else if(k==="style") n.setAttribute("style",v);
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k,v);
  }
  for(const kid of kids){ if(kid==null) continue; n.append(kid.nodeType?kid:document.createTextNode(kid)); }
  return n;
}

function computeMyTeam(cfg, statusMap){
  const mine = cfg.players.filter(p=>statusMap[pid(p)]==="mine").sort((a,b)=>a.rank-b.rank);
  const used=new Set();
  const slots = cfg.meta.starters.map(s=>{
    const pick = mine.find(p=>!used.has(pid(p)) && s.eligible.includes(p.pos));
    if(pick) used.add(pid(pick));
    return {slot:s.slot, player:pick||null};
  });
  const bench = mine.filter(p=>!used.has(pid(p)));
  return { slots, bench, filled:slots.filter(s=>s.player).length, total:slots.length, count:mine.length };
}

function renderLiveBar(head){
  if(state.board!=="redraft") return;
  const L=state.live;
  const bar=el("div",{class:"livebar"});
  let cls="pill", txt="Sleeper sync off";
  if(L.connecting){ txt="Connecting to Sleeper…"; }
  else if(L.on && L.error){ cls="pill err"; txt="Live · "+L.error; }
  else if(L.on){ cls="pill on"; txt="Live · "+L.matched+" picks in"; }
  else if(L.error){ cls="pill err"; txt="Couldn't connect: "+L.error; }
  const pill=el("span",{class:cls});
  pill.append(el("span",{class:"dot"+(L.on&&!L.error?" live":"")}));
  pill.append(txt);
  bar.append(pill);
  bar.append(el("button",{class:"connectbtn gear", title:"Sleeper settings",
    onclick:()=>{state.live.panelOpen=!state.live.panelOpen;render();}}, "⚙"));
  if(L.on) bar.append(el("button",{class:"connectbtn on", onclick:sleeperDisconnect}, "Disconnect"));
  else bar.append(el("button",{class:"connectbtn", onclick:sleeperConnect}, L.connecting?"…":"Connect"));
  head.append(bar);

  if(L.panelOpen){
    const pan=el("div",{class:"live-panel"});

// ===================== TRADE ADVISOR =====================
const ROS_IDX = { byName:{} };
function buildRosIndex(){
  ROS_IDX.byName = {};
  if(!state.ros) return;
  state.ros.players.forEach(p=>{
    const k = p.pos==="DEF" ? "def:"+tnorm(p.team) : nname(p.name)+"|"+p.pos;
    ROS_IDX.byName[k] = p;
  });
}
// Sleeper player record -> our ROS value
function rosFor(sp){
  if(!sp) return null;
  if(sp.pos==="DEF") return ROS_IDX.byName["def:"+tnorm(sp.team)] || null;
  return ROS_IDX.byName[ nname(sp.name)+"|"+sp.pos ] || null;
}
const REPLACEMENT = { QB:8, RB:3, WR:3, TE:2.5, DEF:4 };
function computePpw(sp){ const r=rosFor(sp); return r ? r.ppw : (REPLACEMENT[sp.pos] || 3); }
function computePpwP(sp){ const r=rosFor(sp); return r ? (r.ppwP!==undefined?r.ppwP:r.ppw) : (REPLACEMENT[sp.pos] || 3); }
function sosP(sp){ const r=rosFor(sp); return r && r.sosP!==null && r.sosP!==undefined ? r.sosP : null; }
// value is resolved once per player at sync time; the trade loops run millions of
// comparisons and re-normalising names inside them made this crawl on mobile
function ppw(sp){
  if(state.tr.valueMode==="playoff") return sp._vp !== undefined ? sp._vp : (sp._vp = computePpwP(sp));
  return sp._v !== undefined ? sp._v : (sp._v = computePpw(sp));
}

// cache Sleeper's player dictionary (trimmed) so we don't refetch 5MB every sync
async function loadSleeperPlayers(){
  const KEY="sleeper-players-v2";
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ const o=JSON.parse(raw); if(o.t && (Date.now()-o.t) < 7*864e5) return o.m; }
  }catch(e){}
  const all = await sjson(SLEEPER+"/players/nfl");
  const m={};
  for(const id in all){
    const p=all[id]; if(!p) continue;
    let pos=(p.position||"").toUpperCase();
    if(pos==="DST") pos="DEF";
    if(!["QB","RB","WR","TE","DEF"].includes(pos)) continue;
    const nm = pos==="DEF" ? ((p.last_name||p.first_name||id)+" D/ST")
                           : ((p.first_name||"")+" "+(p.last_name||"")).trim();
    m[id]=[nm,pos,(p.team||"")];
  }
  try{ localStorage.setItem(KEY, JSON.stringify({t:Date.now(), m})); }catch(e){}
  return m;
}

// best possible starting lineup value for a set of players
function lineupOf(players, slots){
  const used=new Set(); const out=[];
  slots.forEach((s,i)=>{
    let best=null, bi=-1;
    players.forEach((p,j)=>{
      if(used.has(j)) return;
      if(!s.eligible.includes(p.pos)) return;
      if(!best || ppw(p)>ppw(best)){ best=p; bi=j; }
    });
    if(bi>=0) used.add(bi);
    out.push({slot:s.slot, player:best});
  });
  const val = out.reduce((a,x)=> a + (x.player?ppw(x.player):0), 0);
  return { slots:out, value:val };
}
const lineupVal = (players, slots) => lineupOf(players, slots).value;
// Depth is not worthless: a bench player carries insurance, bye cover and trade capital.
// Without this the engine happily tosses in your backup QB for free.
const BENCH_W = 0.3;
function rosterValue(players, slots){
  const lu = lineupOf(players, slots);
  const starting = new Set(lu.slots.filter(s=>s.player).map(s=>s.player));
  const bench = players.filter(p=>!starting.has(p)).reduce((a,p)=>a+ppw(p),0);
  return lu.value + BENCH_W*bench;
}
const rawOf = arr => arr.reduce((a,p)=>a+ppw(p),0);

async function tradeSync(){
  const T=state.tr; T.syncing=true; T.error=""; render();
  try{
    const lid = (String(state.live.leagueId).match(/(\d{6,})/)||[])[1] || state.live.leagueId;
    const [league, rosters, users, pmap] = await Promise.all([
      sjson(SLEEPER+"/league/"+lid),
      sjson(SLEEPER+"/league/"+lid+"/rosters"),
      sjson(SLEEPER+"/league/"+lid+"/users"),
      loadSleeperPlayers()
    ]);
    let myUid = state.live.myUserId || await resolveUser(state.live.username);
    state.live.myUserId = myUid;
    const nameOf={}; (users||[]).forEach(u=>{
      nameOf[u.user_id] = (u.metadata && u.metadata.team_name) || u.display_name || "Team";
    });
    const teams = (rosters||[]).map(r=>({
      roster_id:r.roster_id, owner_id:r.owner_id,
      name: nameOf[r.owner_id] || ("Roster "+r.roster_id),
      wins:(r.settings&&r.settings.wins)||0, losses:(r.settings&&r.settings.losses)||0,
      players:(r.players||[]).map(id=>{
        const e=pmap[id]; return e ? {id, name:e[0], pos:e[1], team:e[2]} : null;
      }).filter(Boolean)
    }));
    teams.forEach(t=>t.players.forEach(p=>{ p._v = computePpw(p); p._vp = computePpwP(p); }));
    const mine = teams.find(t=>t.owner_id===myUid);
    if(!mine) throw new Error("couldn't find your roster \u2014 check the username in \u2699");
    T.league=league; T.rosters=teams; T.myRosterId=mine.roster_id;
    T.synced=true; T.syncing=false; T.lastSync=Date.now();
    buildSuggestions();
  }catch(e){
    T.syncing=false; T.synced=false; T.error=String(e.message||e);
  }
  render();
}

function slotsOf(){ return state.BOARDS.redraft.meta.starters; }

function posCount(players,pos){ return players.filter(p=>p.pos===pos).length; }

function buildSuggestions(){
  const T=state.tr; if(!T.rosters) return;
  const slots=slotsOf();
  const me=T.rosters.find(t=>t.roster_id===T.myRosterId);
  const myLuBase=lineupVal(me.players, slots);
  const myRvBase=rosterValue(me.players, slots);
  const out=[];
  const rank=(t)=>t.players.slice().sort((a,b)=>ppw(b)-ppw(a));
  const myTop=rank(me).slice(0,18);

  T.rosters.forEach(opp=>{
    if(opp.roster_id===T.myRosterId) return;
    const oppRvBase=rosterValue(opp.players, slots);
    const theirTop=rank(opp).slice(0,18);

    const consider=(give,get)=>{
      const giveRaw=rawOf(give), getRaw=rawOf(get);
      // you have to pay roughly market price or nobody replies
      if(giveRaw < 0.85*getRaw) return;
      const newMine=me.players.filter(p=>!give.includes(p)).concat(get);
      const newOpp=opp.players.filter(p=>!get.includes(p)).concat(give);
      const lineupGain=lineupVal(newMine,slots)-myLuBase;
      const myGain=rosterValue(newMine,slots)-myRvBase;
      const theirGain=rosterValue(newOpp,slots)-oppRvBase;
      if(lineupGain>0.3 && myGain>0.2 && theirGain>0.3){
        out.push({opp:opp.name, oppId:opp.roster_id, give:give.slice(), get:get.slice(),
                  lineupGain:+lineupGain.toFixed(2), myGain:+myGain.toFixed(2),
                  theirGain:+theirGain.toFixed(2), giveRaw:+giveRaw.toFixed(1), getRaw:+getRaw.toFixed(1)});
      }
    };
    myTop.forEach(a=> theirTop.forEach(b=> consider([a],[b]) ));
    for(let i=0;i<myTop.length;i++)
      for(let j=i+1;j<myTop.length;j++)
        theirTop.forEach(b=> consider([myTop[i],myTop[j]],[b]) );
  });

  out.sort((x,y)=> (y.lineupGain-x.lineupGain) || (y.myGain-x.myGain));

  // drop any 2-for-1 where the 1-for-1 subset already does as well (no free throw-ins)
  const bySingle={};
  out.forEach(t=>{ if(t.give.length===1){
    const k=t.oppId+"|"+t.get[0].name;
    if(!(k in bySingle) || t.lineupGain>bySingle[k]) bySingle[k]=t.lineupGain;
  }});
  const pruned=out.filter(t=>{
    if(t.give.length<2) return true;
    const k=t.oppId+"|"+t.get[0].name;
    return !(k in bySingle) || t.lineupGain > bySingle[k]+0.25;
  });

  // one offer per target player, best few per opponent
  const seen=new Set(), perOpp={}, kept=[];
  for(const t of pruned){
    const key=t.oppId+"|"+t.get.map(p=>p.name).join("+");
    if(seen.has(key)) continue;
    seen.add(key);
    perOpp[t.oppId]=(perOpp[t.oppId]||0)+1;
    if(perOpp[t.oppId]<=3) kept.push(t);
    if(kept.length>=24) break;
  }
  T.suggestions=kept;
}

function myNeeds(){
  const T=state.tr; const slots=slotsOf();
  const me=T.rosters.find(t=>t.roster_id===T.myRosterId);
  const lu=lineupOf(me.players, slots);
  const startersByPos={};
  lu.slots.forEach(s=>{ if(s.player) startersByPos[s.player.pos]=(startersByPos[s.player.pos]||0)+1; });
  const res=[];
  ["QB","RB","WR","TE","DEF"].forEach(pos=>{
    const rostered=posCount(me.players,pos);
    const starting=startersByPos[pos]||0;
    const bench=rostered-starting;
    const startVals=lu.slots.filter(s=>s.player&&s.player.pos===pos).map(s=>ppw(s.player));
    const weakest=startVals.length?Math.min(...startVals):0;
    let kind="";
    if(starting>0 && weakest < {QB:17,RB:11,WR:11,TE:8,DEF:7}[pos]) kind="need";
    else if(bench>=2 && ["RB","WR"].includes(pos)) kind="surplus";
    res.push({pos, rostered, starting, bench, weakest:+weakest.toFixed(1), kind});
  });
  return {needs:res, lineup:lu};
}

function whyLine(t){
  const giveP=t.give.map(p=>p.pos).join("+");
  const getP=t.get[0].pos;
  if(t.give.length>1) return "Consolidates "+giveP+" depth into a starting "+getP+". Bench points don't score, so trading two rotational pieces for one starter is usually the cleanest gain.";
  return "Straight swap that upgrades your starting "+getP+" while giving them the "+giveP+" help their lineup is missing.";
}

function sosPip(p){
  const s=sosP(p);
  if(s===null) return el("span",{class:"tr-sos"},"");
  const cls = s>=4 ? "tr-sos good" : (s<=1 ? "tr-sos bad" : "tr-sos");
  return el("span",{class:cls, title:"Playoff schedule "+s+"/5"}, "\u25cf".repeat(Math.max(1,s)));
}

  else if(T.syncing) msg="Pulling rosters from Sleeper\u2026";

  modes.append(mk("playoff","Playoff weeks","weeks 15-17 schedule"));

  const {needs, lineup} = myNeeds();

  wrap.append(el("div",{class:"tr-sec"}, el("b",{},"Your starting lineup"),
    el("span",{}, lineup.value.toFixed(1)+" pts/wk")));
  const weakest=Math.min(...lineup.slots.filter(s=>s.player).map(s=>ppw(s.player)));

    const row=el("div",{class:"tr-lineup"});

      row.append(sosPip(s.player));
    } else row.append(el("span",{class:"tr-pname", style:"color:var(--muted);font-style:italic"},"empty"));
    wrap.append(row);
  });

  wrap.append(el("div",{class:"tr-sec"}, el("b",{},"Position read")));
  const nd=el("div",{class:"tr-needs"});
  needs.forEach(n=>{
    const c=el("span",{class:"tr-need"+(n.kind?" "+n.kind:"")});
    c.append(el("span",{class:"lbl"}, n.pos));

    nd.append(c);
  });
  wrap.append(nd);

  wrap.append(el("div",{class:"tr-sec"}, el("b",{},"Suggested trades"),
    el("span",{}, T.suggestions.length+" that help both sides")));

  const chips=el("div",{class:"chips", style:"margin-bottom:10px"});
  ["ALL","QB","RB","WR","TE"].forEach(p=>{
    chips.append(el("button",{class:"chip"+(T.posFilter===p?" on":""),
      onclick:()=>{state.tr.posFilter=p;render();}}, p==="ALL"?"All":"Get "+p));
  });
  wrap.append(chips);

  const list=T.suggestions.filter(t=> T.posFilter==="ALL" || t.get.some(p=>p.pos===T.posFilter));
  if(!list.length) wrap.append(el("p",{class:"empty"},"No trade here clears the bar for both sides. Try another position, or refresh after some games."));

  list.forEach(t=>{
    const card=el("div",{class:"tr-card"});
    card.append(el("div",{class:"tr-head2"},
      el("span",{class:"tr-opp"}, t.opp),
      el("span",{class:"tr-gain"}, "+"+t.lineupGain.toFixed(1)+" pts/wk")));
    const side=(label,arr)=>{
      const r=el("div",{class:"tr-side"});
      r.append(el("span",{class:"tr-dir"}, label));
      const pl=el("div",{class:"tr-plist"});
      arr.forEach(p=>{
        const line=el("div",{class:"tr-p"});
        line.append(el("span",{class:"tr-ptag", style:"background:"+(POS_COLOR[p.pos]||"#7a8697")}, p.pos));
        line.append(el("span",{class:"tr-pname"}, p.name));
        line.append(el("span",{class:"tr-ppw"}, ppw(p).toFixed(1)));
        line.append(sosPip(p));
        pl.append(line);
      });
      r.append(pl); return r;
    };
    card.append(side("You get", t.get));
    card.append(side("You give", t.give));
    card.append(el("div",{class:"tr-why"},
      el("b",{},"Why: "), whyLine(t),
      el("br",{}), el("b",{},"Their side: "), "+"+t.theirGain.toFixed(1)+" roster value, so there's a reason to say yes.",
      el("br",{}), el("b",{},"Balance: "), "you send "+t.giveRaw.toFixed(1)+" of weekly output, you get back "+t.getRaw.toFixed(1)+"."));
    wrap.append(card);
  });

  app.append(wrap);
}

async function boot(){
  loadDrafted();
  try{ state.live.leagueId=localStorage.getItem("sleeper-league")||state.live.leagueId;
       state.live.username=localStorage.getItem("sleeper-user")||state.live.username;
       state.live.draftInput=localStorage.getItem("sleeper-draft")||state.live.draftInput; }catch(e){}
  const [r,d] = await Promise.all([loadBoard("redraft"), loadBoard("dynasty")]);
  state.BOARDS.redraft = r; state.BOARDS.dynasty = d;
  buildLiveIndex();
  try{ state.ros = await loadBoard("ros"); buildRosIndex(); }catch(e){ state.ros=null; }
  render();
  try{ if(localStorage.getItem("sleeper-connected")==="1") sleeperConnect(); }catch(e){}
}
boot();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=> navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
